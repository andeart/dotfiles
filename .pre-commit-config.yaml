# Both hook types install from a bare `pre-commit install`, which is what
# bootstrap.sh runs; without this the pre-push tier is never installed.
default_install_hook_types: [pre-commit, pre-push]
# Commit-time unless a hook opts out; only gitleaks-history runs at push.
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: dotfiles-freeze-agents
        name: harvest live agents/claude changes
        entry: bin/dotfiles freeze --pre-commit
        language: system
        pass_filenames: false
        always_run: true

      - id: markdownlint
        name: markdownlint
        entry: markdownlint-cli2 --config .markdownlint.yml
        language: system
        files: \.md$

      - id: yamllint
        name: yamllint
        entry: yamllint
        language: system
        files: \.(yml|yaml)$

      # Range: everything on HEAD that no remote has yet. "origin/HEAD..HEAD"
      # is deliberately avoided - where origin/HEAD is unset gitleaks swallows
      # the git error, scans nothing, and exits 0.
      - id: gitleaks-history
        name: gitleaks (history)
        entry: gitleaks git --redact --no-banner --log-opts "HEAD --not --remotes"
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: bats
        name: bats
        entry: tests/run.sh
        language: system
        pass_filenames: false
        always_run: true

  # Ordered after the local hooks so the staged diff this scans already includes
  # whatever dotfiles-freeze-agents harvested into the commit. `entry` bakes in
  # `--staged` and is not overridable from here, which is why the push-time tier
  # above has to be a local hook rather than a second use of this one.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
