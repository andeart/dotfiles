name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      github.actor == github.repository_owner && (
        (github.event_name == 'issue_comment'
          && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment'
          && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review'
          && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (
          contains(github.event.issue.body, '@claude')
          || contains(github.event.issue.title, '@claude')
        ))
      )
    runs-on: ubuntu-latest
    # Agent runs vary a lot in length, so this is a runaway backstop rather
    # than a bound on expected work.
    timeout-minutes: 30
    environment: claude-scoped
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@6b082c41935b4c8a3b8b0ef85ba4ba4d9eeb8975  # v1.0.189
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_commit_signing: true
