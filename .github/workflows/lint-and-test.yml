name: lint & test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    # The job's real work takes under two minutes. This cap is sized for a
    # release download in the install step stalling with no output, not for
    # slow work.
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The secret scan below walks every commit; a shallow clone would
          # leave it nothing but the tip.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'

      - name: Install lint and test tools
        env:
          BATS_VERSION: 1.14.0
          GITLEAKS_VERSION: 8.30.1
          YQ_VERSION: 4.53.2
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pre-commit yamllint
          npm install -g markdownlint-cli2
          # The largest of these downloads is a little over 20MB, so 120s is
          # ample. The caps are here so a stalled host fails fast rather than
          # sitting silently until the job timeout fires.
          curl_opts=(-sSfL --connect-timeout 10 --max-time 120)
          # Built up across lines so the URL stays under yamllint's 100-char
          # limit; the single-line form trips the line-length rule.
          gitleaks_url="https://github.com/gitleaks/gitleaks/releases/download"
          gitleaks_url="${gitleaks_url}/v${GITLEAKS_VERSION}"
          gitleaks_url="${gitleaks_url}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl "${curl_opts[@]}" "$gitleaks_url" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          # Installed from releases rather than apt: the "yq" apt package is the
          # Python one, which takes jq syntax and cannot run these expressions.
          yq_url="https://github.com/mikefarah/yq/releases/download"
          yq_url="${yq_url}/v${YQ_VERSION}/yq_linux_amd64"
          sudo curl "${curl_opts[@]}" "$yq_url" -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          # jq is a test dependency but is deliberately not installed here:
          # it ships in the runner image, and pulling it from apt would put
          # the Ubuntu mirrors back on this job's critical path.
          #
          # bats comes from the release tarball for the same reason, and
          # because the apt package trails the version the local hook runs.
          bats_url="https://github.com/bats-core/bats-core/archive/refs/tags"
          bats_url="${bats_url}/v${BATS_VERSION}.tar.gz"
          bats_src="$(mktemp -d)"
          curl "${curl_opts[@]}" "$bats_url" \
            | tar -xz -C "$bats_src" --strip-components=1
          sudo "${bats_src}/install.sh" /usr/local

      - name: Run pre-commit (mirrors local hooks)
        run: pre-commit run --all-files --show-diff-on-failure

      # The step above reaches only the staged hook, against an empty index; the
      # pre-push hook does not run there at all. This is the tier that covers
      # history, and the only one doing real work in CI.
      - name: Scan history for secrets
        run: |
          set -euo pipefail
          log="$(mktemp)"
          gitleaks git --redact --no-banner --no-color 2>&1 | tee "$log"
          commits="$(grep -oE '[0-9]+ commits scanned' "$log" | cut -d' ' -f1 | tail -1 || true)"
          # A scan that reaches no commits still exits 0, which would read as a
          # pass while checking nothing.
          if [[ "${commits:-0}" -eq 0 ]]; then
            echo "gitleaks scanned 0 commits - the history tier is not scanning." >&2
            exit 1
          fi
