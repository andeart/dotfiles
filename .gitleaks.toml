# gitleaks reads this from the repo root; no tier passes --config.
[extend]
useDefault = true

# Chords like "shift+alt+down" clear generic-api-key's entropy threshold.
#
# condition = "AND" is load-bearing: without it gitleaks ORs the clauses and
# paths alone exempts the whole file. regexTarget = "line" likewise - the
# finding's "match" drops the leading quote, so a '"key"' pattern never fires
# against it.
#
# Segments cap at 11 characters, under the 12 generic-api-key needs to report
# anything, so no run inside an exempted line can be a finding on its own. The
# longest segment in the file is 5 ("shift").
[[allowlists]]
description = "VS Code keybinding chords are not secrets"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^vscode/keybindings\.json$''']
regexTarget = "line"
regexes = ['''^\s*"key"\s*:\s*"[a-z0-9\[\]\\/;'`,.=_-]{1,11}(?:[ +][a-z0-9\[\]\\/;'`,.=_-]{1,11})*"\s*,?\s*$''']
