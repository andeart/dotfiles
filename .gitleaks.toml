# gitleaks reads this from the repo root; no tier passes --config.
[extend]
useDefault = true

# generic-api-key flags "shift+alt+down" in vscode/keybindings.json: it clears
# the rule's 3.5 entropy floor at 3.522 and no default stopword reaches it. Both
# gates have to hold, so entropy alone does not predict which chord trips next -
# expect to add a line here whenever a scan names one.
#
# condition = "AND" is load-bearing: ORed, `paths` alone exempts the whole file.
[[allowlists]]
description = "VS Code keybinding chords are not secrets"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^vscode/keybindings\.json$''']
regexes = ['''^shift\+alt\+down$''']
