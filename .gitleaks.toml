# gitleaks reads this from the repo root; no tier passes --config.
[extend]
useDefault = true

# "shift+alt+down" is the only chord in the file whose entropy clears
# generic-api-key's 3.5 threshold; the next-closest sits at 3.25. Exempt the
# value itself rather than the lines that hold it - a chord-shaped character
# class would also admit a real secret, since "+" sits inside the rule's base64
# class and joins runs instead of ending them.
#
# condition = "AND" is load-bearing: ORed, `paths` alone exempts the whole file.
[[allowlists]]
description = "VS Code keybinding chords are not secrets"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^vscode/keybindings\.json$''']
regexes = ['''^shift\+alt\+down$''']
